<style>
:root{--bg:#070914;--t1:#eef1ff;--t2:#a4abd0;--t3:#6a7099;--glass:rgba(255,255,255,.055);--glass2:rgba(255,255,255,.1);--line:rgba(255,255,255,.12);--a1:#7c5cff;--a2:#27d3ff;--a3:#ff5cae;--ok:#35e6a0;--warn:#ffb94a;--bad:#ff5a73;--r:20px;--font:'Segoe UI',system-ui,-apple-system,'Noto Sans Bengali','Hind Siliguri',sans-serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

.code{min-height:430px!important;white-space:pre;tab-size:2}

.toast.bad{border-color:rgba(255,90,115,.5)}.toast.ok{border-color:rgba(53,230,160,.5)}
#login{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:20px}

.empty{text-align:center;padding:40px 18px;color:var(--t2)}
.mnav{display:none}

</style>

</div>

  if (h.startsWith('workers')) return { page: 'workers' };

async function streamTo(url, body, onDelta) {
  const headers = { 'content-type': 'application/json', ...localToken() };
  const r = await fetch(url, { method: 'POST', headers, body: JSON.stringify(body), credentials: 'same-origin' });
  if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.error || 'ত্রুটি'); }
  const reader = r.body.getReader(); const dec = new TextDecoder(); let buf = '';
  for (;;) {
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n\n')) >= 0) {
      const ev = buf.slice(0, i); buf = buf.slice(i + 2);
      for (const line of ev.split('\n')) {
        if (!line.startsWith('data:')) continue;
        const d = line.slice(5).trim(); if (d === '[DONE]') return;
        const j = tryJ(d); if (j && j.error) throw new Error(j.error.message || 'ত্রুটি');
        const piece = j && j.choices && j.choices[0] && j.choices[0].delta && j.choices[0].delta.content;
        if (piece) onDelta(piece);
      }
    }
  }
}

  $('#bk-f').onchange = (e) => { const f = e.target.files[0]; if (!f) return; confirmBox('বর্তমান সব Worker বদলে ব্যাকআপ থেকে ফিরবে। নিশ্চিত?', async () => { const r = await api('/restore', 'POST', JSON.parse(await f.text())); r.ok ? toast(`ফিরেছে: ${r.workers}টি Worker`, 'ok') : toast(r.error, 'bad'); refresh(); }); e.target.value = ''; };
